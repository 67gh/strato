name: Release Publisher

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pré-release ?"
        required: true
        default: true
        type: boolean
      release_title:
        description: "Titre (vide = auto)"
        required: false
        default: ""
        type: string

  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [master]

jobs:
  publish-release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select successful build
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          RUN_ID="$TRIGGER_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow=build.yml --status=success --branch=master --limit=1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "No successful Build run found. Run Build before publishing."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # v8 supports the raw single-file artifacts uploaded by Build v7.
      - name: Download direct APK
        uses: actions/download-artifact@v8
        with:
          name: strato-mainline-release.apk
          path: ./artifacts
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build commit
        uses: actions/download-artifact@v8
        with:
          name: release-commit.txt
          path: ./artifacts
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect
        id: inspect
        run: |
          APK="./artifacts/strato-mainline-release.apk"
          BUILD_SHA_FILE="./artifacts/release-commit.txt"
          test -s "$APK"
          test -s "$BUILD_SHA_FILE"
          BUILD_SHA=$(tr -d '[:space:]' < "$BUILD_SHA_FILE")
          if ! [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid build commit"
            exit 1
          fi
          git cat-file -e "$BUILD_SHA^{commit}"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "build_sha=$BUILD_SHA" >> $GITHUB_OUTPUT
          SHORT_SHA=$(git rev-parse --short=12 "$BUILD_SHA")
          DATE=$(date +'%Y.%m.%d')
          echo "version=${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag_name=v${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Release notes
        id: notes
        env:
          RELEASE_TITLE: ${{ inputs.release_title }}
          BUILD_VERSION: ${{ steps.inspect.outputs.version }}
          BUILD_SHA: ${{ steps.inspect.outputs.build_sha }}
        run: |
          TITLE="${RELEASE_TITLE:-Strato Build $BUILD_VERSION}"
          # Step outputs are single-line; the body preserves the full title.
          echo "title=${TITLE//$'\n'/ }" >> "$GITHUB_OUTPUT"
          {
            printf '## %s\n\n' "$TITLE"
            printf '**Date:** %s | **Commit:** %s\n\n' "$(date -u +'%d %B %Y')" "$BUILD_SHA"
            printf '### Download\nDownload strato-mainline-release.apk directly.\n\n'
            printf '### Warning\nExperimental build.\n\n'
            git log --oneline -10 "$BUILD_SHA"
          } > RELEASE_NOTES.md

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.inspect.outputs.tag_name }}"
          git push origin :refs/tags/$TAG 2>/dev/null || true
          git tag -d $TAG 2>/dev/null || true
          git tag -a $TAG "${{ steps.inspect.outputs.build_sha }}" -m "Release $TAG"
          git push origin $TAG

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.inspect.outputs.tag_name }}
          name: ${{ steps.notes.outputs.title }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
          files: ./artifacts/strato-mainline-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
