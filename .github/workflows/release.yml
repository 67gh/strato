name: Release Publisher

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pré-release ?"
        required: true
        default: true
        type: boolean
      release_title:
        description: "Titre (vide = auto)"
        required: false
        default: ""
        type: string

  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [master]

jobs:
  publish-release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: mainline-release-apk
          path: ./artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --repo ${{ github.repository }} --workflow=Build --status=success --branch=master --limit=1 --json databaseId --jq '.[0].databaseId' > run_id.txt
          RUN_ID=$(cat run_id.txt)
          gh run download $RUN_ID --repo ${{ github.repository }} --name mainline-release-apk --dir ./artifacts

      - name: Inspect
        id: inspect
        run: |
          ls -lh ./artifacts/
          APK=$(find ./artifacts -name "*.apk" | head -n 1)
          [ -z "$APK" ] && exit 1
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y.%m.%d')
          echo "version=${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag_name=v${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Release notes
        id: notes
        run: |
          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TITLE="Strato Build ${{ steps.inspect.outputs.version }}"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          cat > RELEASE_NOTES.md << 'EOF'
          ## ${TITLE}
          **Date:** $(date +'%d %B %Y') | **Commit:** ${{ github.sha }}
          ### Download
          Artifact ci-dessous.
          ### Warning
          Build expérimentale.
          EOF
          echo "\`\`\`" >> RELEASE_NOTES.md
          git log --oneline -10 >> RELEASE_NOTES.md
          echo "\`\`\`" >> RELEASE_NOTES.md

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.inspect.outputs.tag_name }}"
          git push origin :refs/tags/$TAG 2>/dev/null || true
          git tag -d $TAG 2>/dev/null || true
          git tag -a $TAG -m "Release $TAG"
          git push origin $TAG

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.inspect.outputs.tag_name }}
          name: ${{ steps.notes.outputs.title }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ github.event.inputs.prerelease || true }}
          files: ./artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
