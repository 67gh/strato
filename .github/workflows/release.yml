name: Release Publisher

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Marquer comme pré-release ?"
        required: true
        default: true
        type: boolean
      release_title:
        description: "Titre personnalisé (laisser vide pour génération auto)"
        required: false
        default: ""
        type: string

  workflow_run:
    workflows: ["Build"]
    types:
      - completed
    branches: [master]

jobs:
  publish-release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        id: download
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: Build
          workflow_conclusion: success
          name: mainline-release-apk
          if_no_artifact_found: fail
          path: ./artifacts

      - name: Inspect artifact
        id: inspect
        run: |
          echo "=== Artifact downloaded ==="
          ls -lh ./artifacts/

          APK=$(find ./artifacts -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found in artifact"
            exit 1
          fi

          echo "apk_path=$APK" >> $GITHUB_OUTPUT

          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y.%m.%d')
          VERSION="${DATE}-${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.inspect.outputs.version }}"
          SHA="${{ github.sha }}"
          APK_NAME=$(basename "${{ steps.inspect.outputs.apk_path }}")

          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TITLE="Strato Build ${VERSION}"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

          cat > RELEASE_NOTES.md << EOF
          ## ${TITLE}

          **Date:** $(date +'%d %B %Y')  
          **Commit:** \`${SHA}\`  
          **Branch:** master

          ### Download
          - \`${APK_NAME}\`

          ### Warning
          This is an **experimental** build for testing purposes.

          ### Recent changes
          EOF

          echo "\`\`\`" >> RELEASE_NOTES.md
          git log --oneline -10 >> RELEASE_NOTES.md
          echo "\`\`\`" >> RELEASE_NOTES.md

          echo "" >> RELEASE_NOTES.md
          echo "---" >> RELEASE_NOTES.md
          echo "*Automatically generated by GitHub Actions*" >> RELEASE_NOTES.md

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.inspect.outputs.tag_name }}" -m "Release ${{ steps.inspect.outputs.tag_name }}"
          git push origin "${{ steps.inspect.outputs.tag_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.inspect.outputs.tag_name }}
          name: ${{ steps.notes.outputs.title }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ github.event.inputs.prerelease || true }}
          files: ./artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release published!"
          echo "Tag: ${{ steps.inspect.outputs.tag_name }}"
          echo "APK: $(basename ${{ steps.inspect.outputs.apk_path }})"
          echo "URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.inspect.outputs.tag_name }}"
