name: Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Auto-increment versionCode
        run: |
          CURRENT_CODE=$(perl -ne 'print $1 if /versionCode\s+(\d+)/' app/build.gradle)
          if [ -z "$CURRENT_CODE" ]; then
            echo "ERROR: versionCode not found in app/build.gradle"
            exit 1
          fi
          NEW_CODE=$((CURRENT_CODE + 1))
          sed -i "s/versionCode[[:space:]]\+$CURRENT_CODE/versionCode $NEW_CODE/" app/build.gradle
          echo "VersionCode: $CURRENT_CODE -> $NEW_CODE"

      - name: Commit versionCode update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add app/build.gradle
          git commit -m "Bump versionCode"
          git push

      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-${{ hashFiles('app/**/*.xml') }}-${{ hashFiles('app/**.kt', 'app/**.java') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-${{ hashFiles('app/**/*.xml') }}-
            ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-
            ${{ runner.os }}-gradle-

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Ninja Build
        run: |
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          echo "$KEYSTORE_B64" | tr -d '\n' | base64 -d > strato-release.keystore
          ls -lh strato-release.keystore

      - name: Android Assemble Signed
        env:
          CMAKE_C_COMPILER_LAUNCHER: "ccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand \
            assembleMainlineRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/strato-release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASS \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mainline-release-apk
          path: app/build/outputs/apk/mainline/release/*.apk
          if-no-files-found: error